version: 1

versionPolicy:
  source: .ci/versions.yaml
  openbao: validation.openbao.primary
  kubernetes: validation.kubernetes.previewMatrix

defaults:
  package: ./test/e2e
  artifactDir: artifacts/e2e
  timeout: 30m
  parallelNodes: 1

releaseGate:
  preview:
    status: active
    groups:
      openbao:
        - openbao-ci
        - openbao-provider-openbao-ci
        - openbao-provider-cli-ci
        - openbao-failure-ci
        - openbao-ha-ci
        - openbao-decrypt-storm-ci
        - openbao-decrypt-soak-ci
        - openbao-load-soak-ci
        - openbao-restore-ci
        - openbao-rotation-ci
        - openbao-provider-upgrade-rollback-ci
        - openbao-cert-auth-ci
        - openbao-provider-certauth-pkcs11-source-ci
        - openbao-provider-certauth-spiffe-source-ci
      kind:
        - kind-smoke
        - kind-convergence
        - kind-upgrade-rollback
        - kind-dr-runbook

lanes:
  - id: openbao-ci
    name: OpenBao CI
    makeTarget: test-e2e-openbao-ci
    package: ./test/e2e
    labelFilter: openbao && transit && ci
    prScope: pr
    environment: local-openbao
    isolation: local-container
    timeout: 6m
    parallelNodes: 1
    enableEnv: E2E_OPENBAO_CI
    versionRefs:
      - validation.openbao.primary
      - validation.openbao.image
    status: active
    reports: true

  - id: openbao-provider-openbao-ci
    name: OpenBao Provider Full Stack CI
    makeTarget: test-e2e-provider-openbao-ci
    package: ./test/e2e
    labelFilter: openbao && kmsv2 && provider && ci
    prScope: pr
    environment: local-openbao
    isolation: local-container
    timeout: 4m
    parallelNodes: 1
    enableEnv: E2E_OPENBAO_CI
    requiredEnv:
      - E2E_PROVIDER_IMAGE
    versionRefs:
      - validation.openbao.primary
      - validation.openbao.image
    status: active
    reports: true

  - id: kind-smoke
    name: Kubernetes KMS v2 Kind Smoke
    makeTarget: test-e2e-kind-smoke
    package: ./test/e2e
    labelFilter: kind && kmsv2 && smoke
    prScope: main
    environment: kind
    isolation: local-cluster
    timeout: 30m
    parallelNodes: 1
    versionRefs:
      - validation.kubernetes.previewMatrix
    status: active
    reports: true

  - id: openbao-cert-auth-ci
    name: OpenBao Certificate Auth CI
    makeTarget: test-e2e-cert-auth-openbao-ci
    package: ./test/e2e
    labelFilter: openbao && certauth && ci
    prScope: pr
    environment: local-openbao
    isolation: local-container
    timeout: 6m
    parallelNodes: 1
    enableEnv: E2E_OPENBAO_CI
    versionRefs:
      - validation.openbao.primary
      - validation.openbao.image
    status: active
    reports: true

  - id: openbao-provider-certauth-spiffe-source-ci
    name: Provider SPIRE Certificate Source CI
    makeTarget: test-e2e-provider-certauth-spiffe-openbao-ci
    package: ./test/e2e
    labelFilter: certauth && spiffe && ci
    prScope: pr
    environment: local-spire
    isolation: local-container
    timeout: 7m
    parallelNodes: 1
    requiredEnv:
      - E2E_PROVIDER_IMAGE
      - E2E_SPIRE_SERVER_IMAGE
      - E2E_SPIRE_AGENT_IMAGE
    versionRefs:
      - validation.spire.primary
      - validation.spire.serverImage
      - validation.spire.agentImage
    status: active
    reports: true

  - id: openbao-provider-certauth-pkcs11-source-ci
    name: OpenBao Provider PKCS#11 SoftHSM Certificate Source CI
    makeTarget: test-e2e-provider-certauth-pkcs11-openbao-ci
    package: ./test/e2e
    labelFilter: openbao && certauth && pkcs11 && ci
    prScope: pr
    environment: local-openbao-softhsm
    isolation: local-container
    timeout: 7m
    parallelNodes: 1
    enableEnv: E2E_OPENBAO_CI
    requiredEnv:
      - E2E_PROVIDER_IMAGE
    versionRefs:
      - validation.openbao.primary
      - validation.openbao.image
    status: active
    reports: true

  - id: kind-convergence
    name: Kubernetes KMS v2 Kind Multi-Control-Plane Convergence
    makeTarget: test-e2e-kind-convergence
    package: ./test/e2e
    labelFilter: kind && kmsv2 && convergence
    prScope: main
    environment: kind
    isolation: local-cluster
    timeout: 45m
    parallelNodes: 1
    versionRefs:
      - validation.kubernetes.previewMatrix
    status: active
    reports: true

  - id: openbao-failure-ci
    name: OpenBao Failure CI
    makeTarget: test-e2e-provider-failure-openbao-ci
    package: ./test/e2e
    labelFilter: openbao && kmsv2 && failure && ci
    prScope: main
    environment: local-openbao
    isolation: local-container
    timeout: 12m
    parallelNodes: 1
    enableEnv: E2E_OPENBAO_CI
    versionRefs:
      - validation.openbao.primary
      - validation.openbao.image
    status: active
    reports: true

  - id: openbao-provider-cli-ci
    name: OpenBao Provider CLI CI
    makeTarget: test-e2e-provider-cli-openbao-ci
    package: ./test/e2e
    labelFilter: openbao && kmsv2 && cli && ci
    prScope: main
    environment: local-openbao
    isolation: local-container
    timeout: 12m
    parallelNodes: 1
    enableEnv: E2E_OPENBAO_CI
    versionRefs:
      - validation.openbao.primary
      - validation.openbao.image
    status: active
    reports: true

  - id: openbao-ha-ci
    name: OpenBao HA Failover CI
    makeTarget: test-e2e-provider-ha-openbao-ci
    package: ./test/e2e
    labelFilter: openbao && kmsv2 && ha && ci
    prScope: main
    environment: local-openbao-ha
    isolation: local-container
    timeout: 7m
    parallelNodes: 1
    enableEnv: E2E_OPENBAO_CI
    versionRefs:
      - validation.openbao.primary
      - validation.openbao.image
    status: active
    reports: true

  - id: openbao-decrypt-storm-ci
    name: OpenBao Decrypt Storm CI
    makeTarget: test-e2e-provider-decrypt-storm-openbao-ci
    package: ./test/e2e
    labelFilter: openbao && kmsv2 && performance && ci
    prScope: main
    environment: local-openbao
    isolation: local-container
    timeout: 5m
    parallelNodes: 1
    enableEnv: E2E_OPENBAO_CI
    versionRefs:
      - validation.openbao.primary
      - validation.openbao.image
    status: active
    reports: true

  - id: openbao-load-soak-ci
    name: OpenBao Load Soak CI
    makeTarget: test-e2e-provider-load-soak-openbao-ci
    package: ./test/e2e
    labelFilter: openbao && kmsv2 && soak && ci
    prScope: main
    environment: local-openbao
    isolation: local-container
    timeout: 6m
    parallelNodes: 1
    enableEnv: E2E_OPENBAO_CI
    versionRefs:
      - validation.openbao.primary
      - validation.openbao.image
    status: active
    reports: true

  - id: openbao-decrypt-soak-ci
    name: OpenBao Sustained Decrypt Soak CI
    makeTarget: test-e2e-provider-decrypt-soak-openbao-ci
    package: ./test/e2e
    labelFilter: openbao && kmsv2 && performance && soak && ci
    prScope: main
    environment: local-openbao
    isolation: local-container
    timeout: 7m
    parallelNodes: 1
    enableEnv: E2E_OPENBAO_CI
    versionRefs:
      - validation.openbao.primary
      - validation.openbao.image
    status: active
    reports: true

  - id: openbao-restore-ci
    name: OpenBao Backend Replacement And Raft Restore CI
    makeTarget: test-e2e-provider-restore-openbao-ci
    package: ./test/e2e
    labelFilter: openbao && kmsv2 && restore && ci
    prScope: main
    environment: local-openbao
    isolation: local-container
    timeout: 18m
    parallelNodes: 1
    enableEnv: E2E_OPENBAO_CI
    versionRefs:
      - validation.openbao.primary
      - validation.openbao.image
    status: active
