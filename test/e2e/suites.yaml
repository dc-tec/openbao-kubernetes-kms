  - id: openbao-rotation-ci
    name: OpenBao Transit Rotation CI
    makeTarget: test-e2e-provider-rotation-openbao-ci
    package: ./test/e2e
    labelFilter: openbao && kmsv2 && rotation && ci
    prScope: main
    environment: local-openbao
    isolation: local-container
    timeout: 8m
    parallelNodes: 1
    enableEnv: E2E_OPENBAO_CI
    versionRefs:
      - validation.openbao.primary
      - validation.openbao.image
    status: active
    reports: true

  - id: openbao-provider-upgrade-rollback-ci
    name: OpenBao Provider Binary Upgrade Rollback CI
    makeTarget: test-e2e-provider-upgrade-rollback-openbao-ci
    package: ./test/e2e
    labelFilter: openbao && kmsv2 && upgrade && rollback && ci
    prScope: main
    environment: local-openbao
    isolation: local-container
    timeout: 8m
    parallelNodes: 1
    enableEnv: E2E_OPENBAO_CI
