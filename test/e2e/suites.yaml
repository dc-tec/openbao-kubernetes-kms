version: 1

versionPolicy:
  source: .ci/versions.yaml
  openbao: validation.openbao.primary
  kubernetes: validation.kubernetes

defaults:
  package: ./test/e2e
  artifactDir: artifacts/e2e
  timeout: 30m
  parallelNodes: 1

lanes:
  - id: openbao-ci
    name: OpenBao CI
    package: ./test/e2e
    labelFilter: openbao && transit && ci
    prScope: pr
    environment: local-openbao
    isolation: local-container
    timeout: 4m
    parallelNodes: 1
    enableEnv: E2E_OPENBAO_CI
    versionRefs:
      - validation.openbao.primary
      - validation.openbao.image
    status: active
    reports: true

  - id: kind-smoke
    name: Kubernetes KMS v2 Kind Smoke
    package: ./test/e2e
    labelFilter: kind && kmsv2 && smoke
    prScope: main
    environment: kind
    isolation: local-cluster
    timeout: 30m
    parallelNodes: 1
    versionRefs:
      - validation.kubernetes.exactVersion
      - validation.kubernetes.kindNodeImage
    status: active
    reports: true

  - id: kind-convergence
    name: Kubernetes KMS v2 Kind Multi-Control-Plane Convergence
    package: ./test/e2e
    labelFilter: kind && kmsv2 && convergence
    prScope: main
    environment: kind
    isolation: local-cluster
    timeout: 45m
    parallelNodes: 1
    versionRefs:
      - validation.kubernetes.exactVersion
      - validation.kubernetes.kindNodeImage
    status: active
    reports: true

  - id: openbao-failure-ci
    name: OpenBao Failure CI
    package: ./test/e2e
    labelFilter: openbao && kmsv2 && failure && ci
    prScope: main
    environment: local-openbao
    isolation: local-container
    timeout: 5m
    parallelNodes: 1
    enableEnv: E2E_OPENBAO_CI
    versionRefs:
      - validation.openbao.primary
      - validation.openbao.image
    status: active
    reports: true

  - id: openbao-decrypt-storm-ci
    name: OpenBao Decrypt Storm CI
    package: ./test/e2e
    labelFilter: openbao && kmsv2 && performance && ci
    prScope: main
    environment: local-openbao
    isolation: local-container
    timeout: 5m
    parallelNodes: 1
    enableEnv: E2E_OPENBAO_CI
    versionRefs:
      - validation.openbao.primary
      - validation.openbao.image
    status: active
    reports: true

  - id: openbao-restore-ci
    name: OpenBao Backend Replacement And Raft Restore CI
    package: ./test/e2e
    labelFilter: openbao && kmsv2 && restore && ci
    prScope: main
    environment: local-openbao
    isolation: local-container
    timeout: 8m
    parallelNodes: 1
    enableEnv: E2E_OPENBAO_CI
    versionRefs:
      - validation.openbao.primary
      - validation.openbao.image
    status: active
    reports: true

  - id: openbao-rotation-ci
    name: OpenBao Transit Rotation CI
    package: ./test/e2e
    labelFilter: openbao && kmsv2 && rotation && ci
    prScope: main
    environment: local-openbao
    isolation: local-container
    timeout: 8m
    parallelNodes: 1
    enableEnv: E2E_OPENBAO_CI
    versionRefs:
      - validation.openbao.primary
      - validation.openbao.image
    status: active
    reports: true

  - id: kind-upgrade-rollback
    name: Kubernetes KMS v2 Kind Static-Pod Upgrade Rollback
    package: ./test/e2e
    labelFilter: kind && kmsv2 && upgrade && rollback
    prScope: main
    environment: kind
    isolation: local-cluster
    timeout: 30m
    parallelNodes: 1
    versionRefs:
      - validation.kubernetes.exactVersion
      - validation.kubernetes.kindNodeImage
    status: active
    reports: true

  - id: release-gate
    name: v0.1 Release Gate
    package: ./test/e2e
    labelFilter: release-gate
    prScope: release
    environment: kind
    isolation: local-cluster
    timeout: 60m
    parallelNodes: 1
    versionRefs:
      - validation.openbao.primary
      - validation.kubernetes.exactVersion
    status: planned
    reports: true
