global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/openbao-kms.rules.yaml

scrape_configs:
  - job_name: openbao-kms-provider
    static_configs:
      - targets:
          - openbao-kms-dev-control-plane:8081

  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090
