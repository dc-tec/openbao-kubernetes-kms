version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    ignore:
      # GO-2026-6443 affects this release; keep the patched 1.83.2 pin.
      - dependency-name: google.golang.org/grpc
        versions: ["1.84.0"]
    groups:
      go-runtime:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /.github/tools
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - tooling

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Amsterdam
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
