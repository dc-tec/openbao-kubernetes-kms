name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_openbao_e2e:
        description: Run OpenBao container E2E lanes.
        required: false
        default: false
        type: boolean
      force_kind_e2e:
        description: Run Kind Kubernetes E2E lanes.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    outputs:
      workflow: ${{ steps.diff.outputs.workflow }}
      docs: ${{ steps.diff.outputs.docs }}
      image: ${{ steps.diff.outputs.image }}
      deployment: ${{ steps.diff.outputs.deployment }}
      openbao_e2e: ${{ steps.diff.outputs.openbao_e2e }}
      kind_e2e: ${{ steps.diff.outputs.kind_e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            for key in workflow docs image deployment openbao_e2e kind_e2e; do
              echo "${key}=false" >> "${GITHUB_OUTPUT}"
            done
            exit 0
          fi

          head_sha="${GITHUB_SHA}"
          base_sha="${PUSH_BEFORE_SHA}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${PR_BASE_SHA}"
            head_sha="${PR_HEAD_SHA}"
          fi

          git fetch --no-tags --prune --depth=1 origin "${base_sha}" || true
          changed="$(git diff --name-only "${base_sha}" "${head_sha}" || true)"
          changed_matches() {
            grep -qE "$1" <<< "${changed}"
          }

          set_output() {
            local key="$1"
            local pattern="$2"
            if changed_matches "${pattern}"; then
              echo "${key}=true" >> "${GITHUB_OUTPUT}"
            else
              echo "${key}=false" >> "${GITHUB_OUTPUT}"
            fi
          }

          set_output workflow '^(\.github/workflows/|\.github/actions/)'
          set_output docs '^(docs/|website/|README\.md|hugo\.toml|CHANGELOG\.md)'
          set_output image '^(Dockerfile(\..*)?|\.dockerignore|go\.(mod|sum)$|vendor/|cmd/|internal/|Makefile|\.ci/versions\.yaml)'
          set_output deployment '^(deploy/|hack/kubeadm/|test/deployment/)'
          set_output openbao_e2e '^(test/e2e/|internal/(openbao|auth|kmsv2|status|runtime|socket|keyregistry|aad)/|cmd/|Dockerfile(\..*)?|go\.(mod|sum)$|vendor/|Makefile|\.ci/versions\.yaml)'
          set_output kind_e2e '^(test/e2e/|deploy/|hack/kubeadm/|internal/(kmsv2|status|runtime|socket|keyregistry|aad)/|cmd/|Dockerfile(\..*)?|go\.(mod|sum)$|vendor/|Makefile|\.ci/versions\.yaml)'

  core:
    name: Core Quality
    runs-on: ubuntu-24.04
    needs: changes
    env:
      GOFLAGS: -mod=vendor
      SEMGREP_VERSION: "1.157.0"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: .github/tools/package-lock.json

      - name: Install ast-grep
        run: npm ci --prefix .github/tools

      - name: Add local npm tools to PATH
        run: echo "${GITHUB_WORKSPACE}/.github/tools/node_modules/.bin" >> "${GITHUB_PATH}"

      - name: Install Semgrep
        run: |
          python3 -m venv .venv-semgrep
          . .venv-semgrep/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "semgrep==${SEMGREP_VERSION}"
          echo "${GITHUB_WORKSPACE}/.venv-semgrep/bin" >> "${GITHUB_PATH}"

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.69.3

      - name: Run core quality gate
        run: make ci-core

  image-security:
    name: Image Security
    runs-on: ubuntu-24.04
    needs: [changes, e2e-provider-images]
    if: github.event_name == 'push' || needs.changes.outputs.image == 'true'
    env:
      E2E_PROVIDER_IMAGE: ghcr.io/${{ github.repository_owner }}/bao-kms-provider:e2e-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download provider image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-provider-base-image
          path: artifacts/e2e-images

      - name: Load provider image
        run: docker load --input artifacts/e2e-images/provider-base.tar

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.69.3

      - name: Scan image
        run: make security-scan-image IMAGE="${E2E_PROVIDER_IMAGE}"

  docs:
    name: Docs Build
    runs-on: ubuntu-24.04
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.docs == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: ./.github/actions/setup-repo-tools
        with:
          bootstrap-tools: "false"

      - name: Build docs
        run: make docs-build

  deployment:
    name: Deployment Samples
    runs-on: ubuntu-24.04
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.deployment == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: ./.github/actions/setup-repo-tools
        with:
          bootstrap-tools: "false"

      - name: Check deployment samples
        run: make deployment-samples-check

  e2e-provider-images:
    name: E2E Provider Images
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.image == 'true' || needs.changes.outputs.openbao_e2e == 'true' || needs.changes.outputs.kind_e2e == 'true' || (github.event_name == 'workflow_dispatch' && (inputs.force_openbao_e2e || inputs.force_kind_e2e))
    env:
      E2E_PROVIDER_IMAGE: ghcr.io/${{ github.repository_owner }}/bao-kms-provider:e2e-${{ github.sha }}
      E2E_PROVIDER_CERTAUTH_PKCS11_IMAGE: ghcr.io/${{ github.repository_owner }}/bao-kms-provider:e2e-certauth-pkcs11-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build provider images
        run: |
          make image IMAGE="${E2E_PROVIDER_IMAGE}"
          make image-certauth-pkcs11-e2e

      - name: Save base provider image
        run: |
          mkdir -p artifacts/e2e-images
          docker save --output artifacts/e2e-images/provider-base.tar "${E2E_PROVIDER_IMAGE}"

      - name: Save OpenBao provider variants
        run: |
          docker save --output artifacts/e2e-images/provider-openbao-variants.tar \
            "${E2E_PROVIDER_CERTAUTH_PKCS11_IMAGE}"

      - name: Upload base provider image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-provider-base-image
          path: artifacts/e2e-images/provider-base.tar
          if-no-files-found: error
          retention-days: 3
          compression-level: 1

      - name: Upload OpenBao provider variants
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-provider-openbao-images
          path: artifacts/e2e-images/provider-openbao-variants.tar
          if-no-files-found: error
          retention-days: 3
          compression-level: 1

  openbao-e2e:
    name: OpenBao E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    needs: [changes, core, e2e-provider-images]
    if: github.event_name == 'push' || needs.changes.outputs.openbao_e2e == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_openbao_e2e)
    env:
      GOFLAGS: -mod=vendor
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Download base provider image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-provider-base-image
          path: artifacts/e2e-images

      - name: Download OpenBao provider variants
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-provider-openbao-images
          path: artifacts/e2e-images

      - name: Load E2E provider images
        run: |
          docker load --input artifacts/e2e-images/provider-base.tar
          docker load --input artifacts/e2e-images/provider-openbao-variants.tar

      - name: Run OpenBao E2E lanes
        env:
          PROVIDER_IMAGE: ghcr.io/${{ github.repository_owner }}/bao-kms-provider:e2e-${{ github.sha }}
          CERTAUTH_PKCS11_IMAGE: ghcr.io/${{ github.repository_owner }}/bao-kms-provider:e2e-certauth-pkcs11-${{ github.sha }}
        run: |
          make test-e2e-openbao-ci
          E2E_PROVIDER_BUILD=false E2E_PROVIDER_IMAGE="${PROVIDER_IMAGE}" make test-e2e-provider-openbao-ci
          E2E_PROVIDER_BUILD=false E2E_PROVIDER_IMAGE="${PROVIDER_IMAGE}" make test-e2e-provider-failure-openbao-ci
          E2E_PROVIDER_BUILD=false E2E_PROVIDER_IMAGE="${PROVIDER_IMAGE}" make test-e2e-provider-rotation-openbao-ci
          E2E_PROVIDER_BUILD=false E2E_PROVIDER_CERTAUTH_PKCS11_IMAGE="${CERTAUTH_PKCS11_IMAGE}" make test-e2e-provider-certauth-pkcs11-openbao-ci

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openbao-e2e-artifacts
          path: artifacts/e2e/
          if-no-files-found: ignore
          retention-days: 7

  kind-e2e:
    name: Kind E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [changes, core, e2e-provider-images]
    if: github.event_name == 'push' || needs.changes.outputs.kind_e2e == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_kind_e2e)
    env:
      GOFLAGS: -mod=vendor
      E2E_PROVIDER_BUILD: "false"
      E2E_PROVIDER_IMAGE: ghcr.io/${{ github.repository_owner }}/bao-kms-provider:e2e-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Install kind
        uses: ./.github/actions/install-kind

      - name: Download provider image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-provider-base-image
          path: artifacts/e2e-images

      - name: Load provider image
        run: docker load --input artifacts/e2e-images/provider-base.tar

      - name: Run Kind E2E lanes
        run: |
          make test-e2e-kind-smoke
          make test-e2e-kind-convergence

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kind-e2e-artifacts
          path: artifacts/e2e/
          if-no-files-found: ignore
          retention-days: 7
