name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    permissions:
      # Needed to read draft release metadata via `gh release view`.
      # `contents: read` cannot see draft releases and causes false 404 failures.
      contents: write
    outputs:
      version: ${{ steps.vars.outputs.version }}
      build_tag: ${{ steps.vars.outputs.build_tag }}
      repro_build_tag: ${{ steps.vars.outputs.repro_build_tag }}
      source_date_epoch: ${{ steps.vars.outputs.source_date_epoch }}
      build_date: ${{ steps.vars.outputs.build_date }}
      commit: ${{ steps.vars.outputs.commit }}
      image: ${{ steps.vars.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Compute release variables
        id: vars
        env:
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_REF_NAME}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([\-+].*)?$ ]]; then
            echo "version must be a semver tag, got ${version}" >&2
            exit 1
          fi

          sha="$(git rev-parse HEAD)"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          build_date="$(date -u -d "@${source_date_epoch}" +%Y-%m-%dT%H:%M:%SZ)"

          {
            echo "version=${version}"
            echo "build_tag=build-${sha}"
            echo "repro_build_tag=repro-${sha}"
            echo "source_date_epoch=${source_date_epoch}"
            echo "build_date=${build_date}"
            echo "commit=${sha}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER}/bao-kms-provider"
          } >> "${GITHUB_OUTPUT}"

      - name: Fail fast if draft GitHub Release is missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.vars.outputs.version }}"
          for _ in $(seq 1 24); do
            release_json="$(gh release view "${version}" --json isDraft,isPrerelease,name 2>/dev/null || true)"
            if [[ -n "${release_json}" ]]; then
              if [[ "$(jq -r '.isDraft' <<<"${release_json}")" != "true" ]]; then
                echo "GitHub Release '${version}' already exists but is not a draft." >&2
                echo "Release assets are immutable after publication; create releases through the release-tag workflow." >&2
                exit 1
              fi
              echo "Found draft GitHub Release ${version}"
              exit 0
            fi
            sleep 5
          done
          echo "Draft GitHub Release '${version}' not found after waiting." >&2
          echo "Merge the release-please PR and allow the Release Tag workflow to create the signed tag and draft release." >&2
          exit 1

  build:
    name: Build Image
    needs: prepare
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-build.yml
    with:
      build_tag: ${{ needs.prepare.outputs.build_tag }}
      ref: ${{ github.ref }}
      version: ${{ needs.prepare.outputs.version }}
      commit: ${{ needs.prepare.outputs.commit }}
      build_date: ${{ needs.prepare.outputs.build_date }}
      source_date_epoch: ${{ needs.prepare.outputs.source_date_epoch }}
      cache_scope: release-${{ needs.prepare.outputs.build_tag }}
    secrets: inherit

  rebuild:
    name: Independent Rebuild Image
    needs: prepare
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/reusable-build.yml
    with:
      build_tag: ${{ needs.prepare.outputs.repro_build_tag }}
      ref: ${{ github.ref }}
      version: ${{ needs.prepare.outputs.version }}
      commit: ${{ needs.prepare.outputs.commit }}
      build_date: ${{ needs.prepare.outputs.build_date }}
      source_date_epoch: ${{ needs.prepare.outputs.source_date_epoch }}
      cache_scope: release-${{ needs.prepare.outputs.repro_build_tag }}
    secrets: inherit

  security-source:
    name: Security Gate (source)
    runs-on: ubuntu-24.04
    needs: prepare
    env:
      GOFLAGS: -mod=vendor
      SEMGREP_VERSION: "1.157.0"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref }}

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Install Semgrep
        run: |
          python3 -m venv .venv-semgrep
          . .venv-semgrep/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "semgrep==${SEMGREP_VERSION}"
          echo "${GITHUB_WORKSPACE}/.venv-semgrep/bin" >> "${GITHUB_PATH}"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: .github/tools/package-lock.json

      - name: Install ast-grep
        run: npm ci --prefix .github/tools

      - name: Add local npm tools to PATH
        run: echo "${GITHUB_WORKSPACE}/.github/tools/node_modules/.bin" >> "${GITHUB_PATH}"

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.69.3

      - name: Run source security gates
        run: |
          make lint-ci
          make security-ci

  security-image:
    name: Security Gate (image)
    runs-on: ubuntu-24.04
    needs: [prepare, build]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref }}

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.69.3

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          skip-setup-trivy: true
          scan-type: image
          image-ref: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.build_tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

  e2e-openbao:
    name: Release Gate OpenBao E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    needs: [prepare, build]
    permissions:
      contents: read
      packages: read
    env:
      GOFLAGS: -mod=vendor
      E2E_PROVIDER_BUILD: "false"
      E2E_PROVIDER_RELEASE_IMAGE: ${{ needs.prepare.outputs.image }}@${{ needs.build.outputs.image_digest }}
      E2E_PROVIDER_IMAGE: ${{ needs.prepare.outputs.image }}:release-e2e-${{ needs.prepare.outputs.commit }}
      E2E_PROVIDER_OLD_IMAGE: ${{ needs.prepare.outputs.image }}:e2e-upgrade-old-${{ needs.prepare.outputs.commit }}
      E2E_PROVIDER_NEW_IMAGE: ${{ needs.prepare.outputs.image }}:e2e-upgrade-new-${{ needs.prepare.outputs.commit }}
      E2E_PROVIDER_CERTAUTH_PKCS11_IMAGE: ${{ needs.prepare.outputs.image }}:e2e-certauth-pkcs11-${{ needs.prepare.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref }}

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull release provider image
        run: |
          docker pull "${E2E_PROVIDER_RELEASE_IMAGE}"
          docker tag "${E2E_PROVIDER_RELEASE_IMAGE}" "${E2E_PROVIDER_IMAGE}"

      - name: Build OpenBao validation images
        run: |
          make image IMAGE="${E2E_PROVIDER_OLD_IMAGE}" VERSION="${{ needs.prepare.outputs.version }}-e2e-old" COMMIT="${{ needs.prepare.outputs.commit }}-old"
          make image IMAGE="${E2E_PROVIDER_NEW_IMAGE}" VERSION="${{ needs.prepare.outputs.version }}-e2e-new" COMMIT="${{ needs.prepare.outputs.commit }}-new"
          make image-certauth-pkcs11-e2e

      - name: Run OpenBao release E2E lanes
        run: make test-e2e-release-preview-openbao

      - name: Upload OpenBao E2E artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-openbao-e2e-artifacts
          path: artifacts/e2e/
          if-no-files-found: ignore
          retention-days: 14

  kind-matrix:
    name: Kind Release Gate Matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    env:
      GOFLAGS: -mod=vendor
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref }}

      - name: Setup Go
        uses: ./.github/actions/setup-repo-tools
        with:
          bootstrap-tools: "false"

      - name: Resolve Kind release gate matrix
        id: matrix
        run: |
          set -euo pipefail
          matrix="$(go run ./hack/tools/e2e_release_gate -group kind -matrix)"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  e2e-kind:
    name: Release Gate Kind E2E (Kubernetes ${{ matrix.kubernetes_line }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    needs: [prepare, build, kind-matrix]
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.kind-matrix.outputs.matrix) }}
    env:
      GOFLAGS: -mod=vendor
      E2E_PROVIDER_BUILD: "false"
      E2E_PROVIDER_RELEASE_IMAGE: ${{ needs.prepare.outputs.image }}@${{ needs.build.outputs.image_digest }}
      E2E_PROVIDER_IMAGE: ${{ needs.prepare.outputs.image }}:release-e2e-${{ needs.prepare.outputs.commit }}
      E2E_KUBERNETES_LINE: ${{ matrix.kubernetes_line }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref }}

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull release provider image
        run: |
          docker pull "${E2E_PROVIDER_RELEASE_IMAGE}"
          docker tag "${E2E_PROVIDER_RELEASE_IMAGE}" "${E2E_PROVIDER_IMAGE}"

      - name: Install kind
        uses: ./.github/actions/install-kind

      - name: Run Kind release E2E lanes
        run: make test-e2e-release-preview-kind

      - name: Upload Kind E2E artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-kind-${{ matrix.kubernetes_line }}-e2e-artifacts
          path: artifacts/e2e/
          if-no-files-found: ignore
          retention-days: 14

  verify-artifacts:
    name: Verify Release Artifacts
    runs-on: ubuntu-24.04
    needs: [prepare, build, rebuild]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Install release packaging tools
        run: make install-release-tools

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build primary binaries
        env:
          GOFLAGS: -mod=vendor
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
        run: |
          make release-artifacts \
            DIST_DIR=dist/primary \
            VERSION="${{ needs.prepare.outputs.version }}" \
            COMMIT="${{ needs.prepare.outputs.commit }}" \
            DIRTY=false

      - name: Build primary systemd packages and bundles
        env:
          GOFLAGS: -mod=vendor
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        run: |
          make release-packages release-bundles \
            DIST_DIR=dist/primary \
            VERSION="${{ needs.prepare.outputs.version }}" \
            IMAGE="${{ needs.prepare.outputs.image }}"

      - name: Build independent rebuild binaries
        env:
          GOFLAGS: -mod=vendor
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
        run: |
          make release-artifacts \
            DIST_DIR=dist/rebuild \
            VERSION="${{ needs.prepare.outputs.version }}" \
            COMMIT="${{ needs.prepare.outputs.commit }}" \
            DIRTY=false

      - name: Build rebuild systemd packages and bundles
        env:
          GOFLAGS: -mod=vendor
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
          IMAGE_DIGEST: ${{ needs.rebuild.outputs.image_digest }}
        run: |
          make release-packages release-bundles \
            DIST_DIR=dist/rebuild \
            VERSION="${{ needs.prepare.outputs.version }}" \
            IMAGE="${{ needs.prepare.outputs.image }}"

      - name: Generate image SBOM (primary)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ needs.prepare.outputs.image }}@${{ needs.build.outputs.image_digest }}
          format: spdx-json
          output-file: dist/primary/sbom-bao-kms-provider-image.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image SBOM (rebuild)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ needs.prepare.outputs.image }}@${{ needs.rebuild.outputs.image_digest }}
          format: spdx-json
          output-file: dist/rebuild/sbom-bao-kms-provider-image.spdx.json
          upload-artifact: "false"
          upload-release-assets: "false"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate binary SBOMs (primary)
        env:
          GOFLAGS: -mod=vendor
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          BINARY_PATH="dist/primary/bao-kms-provider_${VERSION}_linux_amd64" OUTPUT_PATH="dist/primary/sbom-bao-kms-provider-linux-amd64.spdx.json" GOOS=linux GOARCH=amd64 bash hack/ci/generate-go-binary-sbom.sh
          BINARY_PATH="dist/primary/bao-kms-provider_${VERSION}_linux_arm64" OUTPUT_PATH="dist/primary/sbom-bao-kms-provider-linux-arm64.spdx.json" GOOS=linux GOARCH=arm64 bash hack/ci/generate-go-binary-sbom.sh

      - name: Generate binary SBOMs (rebuild)
        env:
          GOFLAGS: -mod=vendor
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          BINARY_PATH="dist/rebuild/bao-kms-provider_${VERSION}_linux_amd64" OUTPUT_PATH="dist/rebuild/sbom-bao-kms-provider-linux-amd64.spdx.json" GOOS=linux GOARCH=amd64 bash hack/ci/generate-go-binary-sbom.sh
          BINARY_PATH="dist/rebuild/bao-kms-provider_${VERSION}_linux_arm64" OUTPUT_PATH="dist/rebuild/sbom-bao-kms-provider-linux-arm64.spdx.json" GOOS=linux GOARCH=arm64 bash hack/ci/generate-go-binary-sbom.sh

      - name: Normalize SBOM JSON
        env:
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
        run: |
          bash hack/ci/normalize-spdx-json.sh \
            dist/primary/sbom-bao-kms-provider-image.spdx.json \
            dist/primary/sbom-bao-kms-provider-linux-amd64.spdx.json \
            dist/primary/sbom-bao-kms-provider-linux-arm64.spdx.json \
            dist/rebuild/sbom-bao-kms-provider-image.spdx.json \
            dist/rebuild/sbom-bao-kms-provider-linux-amd64.spdx.json \
            dist/rebuild/sbom-bao-kms-provider-linux-arm64.spdx.json

      - name: Generate deterministic checksums
        run: |
          set -euo pipefail
          for dir in dist/primary dist/rebuild; do
            make checksums DIST_DIR="${dir}"
          done

      - name: Verify byte reproducibility
        env:
          PRIMARY_DIR: dist/primary
          REBUILD_DIR: dist/rebuild
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          IMAGE_REBUILD_DIGEST: ${{ needs.rebuild.outputs.image_digest }}
        run: bash hack/ci/verify-byte-reproducibility.sh

      - name: Write reproducibility report
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          IMAGE_REBUILD_DIGEST: ${{ needs.rebuild.outputs.image_digest }}
        run: |
          set -euo pipefail
          report_path="dist/reproducibility-report.md"
          {
            echo "## Reproducibility Report"
            echo
            echo "Tag: \`${VERSION}\`"
            echo
            echo "| Subject | Primary | Rebuild | Match |"
            echo "| :--- | :--- | :--- | :---: |"
            if [[ "${IMAGE_DIGEST}" == "${IMAGE_REBUILD_DIGEST}" ]]; then mark="yes"; else mark="no"; fi
            echo "| image | \`${IMAGE_DIGEST}\` | \`${IMAGE_REBUILD_DIGEST}\` | ${mark} |"
            for rel in checksums.txt $(awk '{print $2}' dist/primary/checksums.txt); do
              primary="$(sha256sum "dist/primary/${rel}" | awk '{print $1}')"
              rebuild="$(sha256sum "dist/rebuild/${rel}" | awk '{print $1}')"
              if [[ "${primary}" == "${rebuild}" ]]; then mark="yes"; else mark="no"; fi
              echo "| ${rel} | \`${primary}\` | \`${rebuild}\` | ${mark} |"
            done
          } > "${report_path}"
          cat "${report_path}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload byte-verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-byte-verified-assets
          path: dist/primary/*
          retention-days: 14

      - name: Upload reproducibility report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-reproducibility-report
          path: dist/reproducibility-report.md
          retention-days: 30

  promote:
    name: Promote And Publish
    runs-on: ubuntu-24.04
    needs:
      - prepare
      - build
      - rebuild
      - security-source
      - security-image
      - e2e-openbao
      - e2e-kind
      - verify-artifacts
    environment:
      name: release-publish
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download byte-verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-byte-verified-assets
          path: dist

      - name: Download reproducibility report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-reproducibility-report
          path: dist

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.31.1

      - name: Promote image tag
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        run: docker buildx imagetools create -t "${IMAGE}:${VERSION}" "${IMAGE}@${IMAGE_DIGEST}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.4

      - name: Sign image
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
        run: cosign sign --yes --new-bundle-format=true "${IMAGE}@${IMAGE_DIGEST}"

      - name: Verify image signature
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cosign verify \
            --new-bundle-format=true \
            --certificate-identity "https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/${VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${IMAGE_DIGEST}" >/dev/null

      - name: Attest checksums provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/checksums.txt

      - name: Attest release asset provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Record private dry-run attestation limitation
        if: ${{ github.event.repository.private }}
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<'EOF'
          GitHub release asset attestations were skipped because this is a private repository dry run. Public release tags must run with attestations enabled.
          EOF

      - name: Sign release checksums
        run: |
          cosign sign-blob \
            --yes \
            --new-bundle-format=true \
            --bundle dist/checksums.txt.bundle \
            dist/checksums.txt

      - name: Verify release checksums signature
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cosign verify-blob \
            --new-bundle-format=true \
            --bundle dist/checksums.txt.bundle \
            --certificate-identity "https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/${VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            dist/checksums.txt >/dev/null

      - name: Verify image attestation
        if: ${{ !github.event.repository.private }}
        uses: ./.github/actions/verify-image-attestations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          repo: ${{ github.repository }}
          version: ${{ needs.prepare.outputs.version }}
          image-refs: ${{ needs.prepare.outputs.image }}@${{ needs.build.outputs.image_digest }}

      - name: Verify release asset attestations
        if: ${{ !github.event.repository.private }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash hack/ci/verify-release-artifact-attestations.sh

      - name: Setup repo tools for provenance index
        uses: ./.github/actions/setup-repo-tools
        with:
          bootstrap-tools: "false"

      - name: Generate provenance index
        env:
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
          IMAGE: ${{ needs.prepare.outputs.image }}
          IMAGE_DIGEST: ${{ needs.build.outputs.image_digest }}
          IMAGE_REBUILD_DIGEST: ${{ needs.rebuild.outputs.image_digest }}
          ATTESTATIONS_AVAILABLE: ${{ !github.event.repository.private }}
          ATTESTATIONS_UNAVAILABLE_REASON: private-repository-dry-run
        run: bash hack/ci/generate-provenance-index.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          prerelease_flag=""
          if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            prerelease_flag="--prerelease"
          fi

          release_json="$(gh release view "${VERSION}" --json isDraft,assets)"
          if [[ "$(jq -r '.isDraft' <<<"${release_json}")" != "true" ]]; then
            echo "::error::GitHub release ${VERSION} is not a draft. Immutable releases cannot receive or replace assets after publication."
            exit 1
          fi

          shopt -s nullglob
          assets=(dist/*)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "::error::no release assets found in dist/"
            exit 1
          fi

          declare -A existing_asset_sizes=()
          while IFS=$'\t' read -r name size; do
            if [[ -n "${name}" ]]; then
              existing_asset_sizes["${name}"]="${size}"
            fi
          done < <(jq -r '.assets[]? | [.name, (.size|tostring)] | @tsv' <<<"${release_json}")

          tmp_existing="$(mktemp -d)"
          trap 'rm -rf "${tmp_existing}"' EXIT

          to_upload=()
          for file in "${assets[@]}"; do
            name="$(basename "${file}")"
            if [[ -n "${existing_asset_sizes[${name}]-}" ]]; then
              local_size="$(stat -c%s "${file}")"
              if [[ "${local_size}" != "${existing_asset_sizes[${name}]}" ]]; then
                echo "::error::Release asset '${name}' already exists but size differs (local=${local_size}, release=${existing_asset_sizes[${name}]})."
                exit 1
              fi

              gh release download "${VERSION}" --pattern "${name}" --dir "${tmp_existing}"
              local_sha="$(sha256sum "${file}" | awk '{print $1}')"
              release_sha="$(sha256sum "${tmp_existing}/${name}" | awk '{print $1}')"
              if [[ "${local_sha}" != "${release_sha}" ]]; then
                echo "::error::Release asset '${name}' already exists but content differs (local_sha=${local_sha}, release_sha=${release_sha})."
                exit 1
              fi
              continue
            fi
            to_upload+=("${file}")
          done

          if (( ${#to_upload[@]} > 0 )); then
            gh release upload "${VERSION}" "${to_upload[@]}"
          fi

          if [[ -n "${prerelease_flag}" ]]; then
            gh release edit "${VERSION}" --title "${VERSION}" --draft=false --prerelease
          else
            gh release edit "${VERSION}" --title "${VERSION}" --draft=false --latest
          fi
