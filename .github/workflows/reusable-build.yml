name: Reusable Build Image

on:
  workflow_call:
    inputs:
      build_tag:
        description: Technical tag to apply to the image.
        required: true
        type: string
      ref:
        description: Immutable commit SHA or semver tag ref to checkout.
        required: true
        type: string
      version:
        description: Version string embedded into the binary.
        required: true
        type: string
      commit:
        description: Commit string embedded into the binary.
        required: true
        type: string
      build_date:
        description: RFC3339 build date embedded into the binary.
        required: true
        type: string
      source_date_epoch:
        description: Unix timestamp for deterministic build metadata.
        required: true
        type: string
      cache_scope:
        description: BuildKit GHA cache scope.
        required: false
        default: trusted
        type: string
    outputs:
      image_digest:
        description: Digest of the pushed image.
        value: ${{ jobs.build.outputs.image_digest }}

permissions:
  contents: read

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Validate checkout ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [[ "${REF}" =~ ^[0-9a-f]{40}$ ]]; then
            exit 0
          fi
          if [[ "${REF}" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+([\-+].*)?$ ]]; then
            exit 0
          fi
          echo "inputs.ref must be an immutable commit SHA or semver tag ref; got: ${REF}" >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.31.1

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          outputs: type=image,push=true,rewrite-timestamp=true
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ inputs.commit }}
            BUILD_DATE=${{ inputs.build_date }}
            DIRTY=false
            SOURCE_DATE_EPOCH=${{ inputs.source_date_epoch }}
          tags: ghcr.io/${{ github.repository_owner }}/bao-kms-provider:${{ inputs.build_tag }}
          cache-from: type=gha,scope=${{ inputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope }}

      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/bao-kms-provider
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record private dry-run attestation limitation
        if: ${{ github.event.repository.private }}
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" <<'EOF'
          GitHub build-provenance attestations were skipped because this is a private repository dry run. Public release tags must run with attestations enabled.
          EOF
