name: Reusable Build Image

on:
  workflow_call:
    inputs:
      build_tag:
        description: Technical tag to apply to the image.
        required: true
        type: string
      ref:
        description: Immutable commit SHA or semver tag ref to checkout.
        required: true
        type: string
      version:
        description: Version string embedded into the binary.
        required: true
        type: string
      commit:
        description: Commit string embedded into the binary.
        required: true
        type: string
      build_date:
        description: RFC3339 build date embedded into the binary.
        required: true
        type: string
      source_date_epoch:
        description: Unix timestamp for deterministic build metadata.
        required: true
        type: string
      cache_scope:
        description: BuildKit GHA cache scope.
        required: false
        default: trusted
        type: string
    outputs:
      image_digest:
        description: Digest of the pushed image.
        value: ${{ jobs.build.outputs.image_digest }}

permissions:
  contents: read

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Validate checkout ref
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [[ "${REF}" =~ ^[0-9a-f]{40}$ ]]; then
            exit 0
          fi
          if [[ "${REF}" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+([\-+].*)?$ ]]; then
            exit 0
          fi
          echo "inputs.ref must be an immutable commit SHA or semver tag ref; got: ${REF}" >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          version: v0.31.1

      - name: Build and push
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ inputs.commit }}
            BUILD_DATE=${{ inputs.build_date }}
            DIRTY=false
            SOURCE_DATE_EPOCH=${{ inputs.source_date_epoch }}
          tags: ghcr.io/${{ github.repository_owner }}/bao-kms-provider:${{ inputs.build_tag }}
          cache-from: type=gha,scope=${{ inputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/bao-kms-provider
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
