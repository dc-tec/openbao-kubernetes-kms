name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core Quality
    runs-on: ubuntu-24.04
    env:
      GOFLAGS: -mod=vendor
      SEMGREP_VERSION: "1.157.0"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: .github/tools/package-lock.json

      - name: Install ast-grep
        run: npm ci --prefix .github/tools

      - name: Add local npm tools to PATH
        run: echo "${GITHUB_WORKSPACE}/.github/tools/node_modules/.bin" >> "${GITHUB_PATH}"

      - name: Install Semgrep
        run: |
          python3 -m venv .venv-semgrep
          . .venv-semgrep/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "semgrep==${SEMGREP_VERSION}"
          echo "${GITHUB_WORKSPACE}/.venv-semgrep/bin" >> "${GITHUB_PATH}"

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.69.3

      - name: Run core quality gate
        run: make ci-core

  openbao-e2e:
    name: OpenBao E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: core
    env:
      GOFLAGS: -mod=vendor
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Run OpenBao E2E lanes
        run: |
          make test-e2e-openbao-ci
          make test-e2e-provider-failure-openbao-ci
          make test-e2e-provider-ha-openbao-ci
          make test-e2e-provider-decrypt-storm-openbao-ci
          make test-e2e-provider-load-soak-openbao-ci
          make test-e2e-provider-restore-openbao-ci
          make test-e2e-provider-rotation-openbao-ci
          make test-e2e-provider-upgrade-rollback-openbao-ci

      - name: Upload OpenBao E2E artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-openbao-e2e-artifacts
          path: artifacts/e2e/
          if-no-files-found: ignore
          retention-days: 7

  kind-e2e:
    name: Kind E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    needs: core
    env:
      GOFLAGS: -mod=vendor
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Install kind
        uses: ./.github/actions/install-kind

      - name: Run Kind E2E lanes
        run: |
          make test-e2e-kind-smoke
          make test-e2e-kind-convergence
          make test-e2e-kind-upgrade-rollback
          make test-e2e-kind-dr-runbook

      - name: Upload Kind E2E artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-kind-e2e-artifacts
          path: artifacts/e2e/
          if-no-files-found: ignore
          retention-days: 7
