name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core Quality
    runs-on: ubuntu-24.04
    env:
      GOFLAGS: -mod=vendor
      SEMGREP_VERSION: "1.172.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: .github/tools/package-lock.json

      - name: Install ast-grep
        run: npm ci --prefix .github/tools

      - name: Add local npm tools to PATH
        run: echo "${GITHUB_WORKSPACE}/.github/tools/node_modules/.bin" >> "${GITHUB_PATH}"

      - name: Install Semgrep
        run: |
          python3 -m venv .venv-semgrep
          . .venv-semgrep/bin/activate
          python -m pip install --upgrade pip
          python -m pip install "semgrep==${SEMGREP_VERSION}"
          echo "${GITHUB_WORKSPACE}/.venv-semgrep/bin" >> "${GITHUB_PATH}"

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.73.0

      - name: Run core quality gate
        run: make ci-core

  openbao-e2e:
    name: OpenBao E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    needs: core
    env:
      GOFLAGS: -mod=vendor
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Run OpenBao E2E lanes
        run: make test-e2e-release-preview-openbao

      - name: Upload OpenBao E2E artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-openbao-e2e-artifacts
          path: artifacts/e2e/
          if-no-files-found: ignore
          retention-days: 7

  kind-matrix:
    name: Kind Matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    env:
      GOFLAGS: -mod=vendor
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: ./.github/actions/setup-repo-tools
        with:
          bootstrap-tools: "false"

      - name: Resolve Kind matrix
        id: matrix
        run: |
          set -euo pipefail
          matrix="$(go run ./hack/tools/e2e_release_gate -group kind -matrix)"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  kind-e2e:
    name: Kind E2E (Kubernetes ${{ matrix.kubernetes_line }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    needs: [core, kind-matrix]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.kind-matrix.outputs.matrix) }}
    env:
      GOFLAGS: -mod=vendor
      E2E_KUBERNETES_LINE: ${{ matrix.kubernetes_line }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup repo tools
        uses: ./.github/actions/setup-repo-tools

      - name: Install kind
        uses: ./.github/actions/install-kind

      - name: Run Kind E2E lanes
        run: make test-e2e-release-preview-kind

      - name: Upload Kind E2E artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-kind-${{ matrix.kubernetes_line }}-e2e-artifacts
          path: artifacts/e2e/
          if-no-files-found: ignore
          retention-days: 7
