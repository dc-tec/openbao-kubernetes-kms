name: Action rehearsal

on:
  pull_request:
    paths:
      - .github/workflows/action-rehearsal.yml
      - .github/actions/token-revocation-probe/**
      - hack/ci/rehearse-cosign.sh
  workflow_dispatch:
    inputs:
      run_app_token:
        description: Use the existing release-PR App to mint a contents-read KMS-only token.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: action-rehearsal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  probe-tests:
    name: Token probe tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: node --test .github/actions/token-revocation-probe/probe.test.cjs

  app-token:
    name: Read-only App token rehearsal
    # Secrets run only for the owner-authored, same-repository rehearsal branch,
    # or an owner-dispatched run. Forks and Dependabot never receive the key.
    if: >-
      github.repository == 'dc-tec/openbao-kubernetes-kms' &&
      github.actor == 'dc-tec' &&
      ((github.event_name == 'workflow_dispatch' && inputs.run_app_token) ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.user.login == 'dc-tec' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'ci/action-rehearsal'))
    needs: probe-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require existing App configuration
        env:
          APP_ID: ${{ secrets.OPENBAO_KMS_RELEASE_PR_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.OPENBAO_KMS_RELEASE_PR_PRIVATE_KEY }}
        run: test -n "$APP_ID" && test -n "$APP_PRIVATE_KEY"
      # Register first so this post hook runs AFTER the candidate token action
      # revokes its token. The hook writes a sanitized receipt to the job log
      # and summary, then removes its private runner file even on failure.
      - name: Register post-action revocation check
        id: probe
        uses: ./.github/actions/token-revocation-probe
      - name: Mint repository-scoped read-only token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.OPENBAO_KMS_RELEASE_PR_APP_ID }}
          private-key: ${{ secrets.OPENBAO_KMS_RELEASE_PR_PRIVATE_KEY }}
          owner: dc-tec
          repositories: openbao-kubernetes-kms
          permission-contents: read
          skip-token-revoke: false
      - name: Verify scope with read-only API calls
        env:
          PROBE_DIRECTORY: ${{ steps.probe.outputs.directory }}
          REHEARSAL_TOKEN: ${{ steps.app.outputs.token }}
        run: node .github/actions/token-revocation-probe/probe.cjs

  cosign:
    name: Local blob signing rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install candidate Cosign through its verified bootstrap
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.0.4
          install-dir: ${{ runner.temp }}/kms-rehearsal-cosign
          use-sudo: false
      - name: Sign and verify a local synthetic blob
        run: bash hack/ci/rehearse-cosign.sh
      - name: Retain public test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cosign-rehearsal-${{ github.sha }}
          path: ${{ runner.temp }}/kms-cosign-evidence/
          if-no-files-found: error
          retention-days: 7
