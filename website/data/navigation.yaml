# Sidebar navigation. Every published docs page must appear here;
# website/scripts/check-rendered-site.py fails the build otherwise.
#
# Items with a `step` form the Previous and Next path of their group. Items
# that share a step are alternatives: the path skips from the step before
# them to each alternative and from each alternative to the step after them.
primary:
  - title: Get started
    description: "Choose a deployment model, plan identity values, prepare OpenBao, install the provider, and enable encryption."
    url: docs/get-started/
    items:
