{{- range .Values.vms }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}-cloudinit
  namespace: {{ $.Values.namespace }}
  labels:
{{ include "openbao-kms-harvester-lab.vmLabels" (dict "root" $ "vm" .) | indent 4 }}
type: Opaque
stringData:
  userdata: |
    #cloud-config
    package_update: {{ $.Values.cloudInit.packageUpdate }}
    packages:
{{- range $.Values.cloudInit.packages }}
      - {{ . }}
{{- end }}
    write_files:
      - path: /etc/modules-load.d/openbao-kms-k8s.conf
        owner: root:root
        permissions: '0644'
        content: |
          overlay
          br_netfilter
      - path: /etc/sysctl.d/99-openbao-kms-k8s.conf
        owner: root:root
        permissions: '0644'
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
      - path: /etc/openbao-kms-lab-role
        owner: root:root
        permissions: '0644'
        content: |
          {{ .role }}
      - path: /usr/local/bin/openbao-kms-lab-network.sh
        owner: root:root
        permissions: '0755'
        content: |
          #!/bin/sh
          set -eu
          iface="${1:-enp1s0}"
          mtu="{{ $.Values.cloudInit.mtu }}"
          if ip link show "$iface" >/dev/null 2>&1; then
            ip link set dev "$iface" mtu "$mtu" || true
          fi
          if [ -d /etc/netplan ]; then
            for file in /etc/netplan/*.yaml; do
              [ -f "$file" ] || continue
              if grep -q "$iface" "$file" && ! grep -q "mtu: $mtu" "$file"; then
                cp "$file" "$file.openbao-kms-lab.bak"
                sed -i "/$iface:/a\\      mtu: $mtu" "$file" || true
              fi
            done
            netplan apply || true
          fi
    users:
      - name: {{ $.Values.cloudInit.username }}
        sudo: ALL=(ALL) NOPASSWD:ALL
        groups: [sudo]
        lock_passwd: true
        shell: /bin/bash
        ssh_authorized_keys:
{{- range $.Values.cloudInit.sshAuthorizedKeys }}
          - {{ . | quote }}
{{- end }}
    ssh_authorized_keys:
{{- range $.Values.cloudInit.sshAuthorizedKeys }}
      - {{ . | quote }}
{{- end }}
    runcmd:
      - modprobe overlay || true
      - modprobe br_netfilter || true
      - sysctl --system
      - systemctl enable --now qemu-guest-agent.service || true
      - /usr/local/bin/openbao-kms-lab-network.sh enp1s0 || true
  networkdata: |
    network:
      version: 2
      ethernets:
        enp1s0:
          dhcp4: true
          dhcp6: false
          optional: false
          mtu: {{ $.Values.cloudInit.mtu }}
{{- end }}
