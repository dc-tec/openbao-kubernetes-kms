groups:
  - name: openbao-kubernetes-kms.rules
    rules:
      - alert: OpenBaoKMSStatusCacheStale
        expr: max by (job, instance) (openbao_kms_status_cache_age_seconds) > 120
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "OpenBao KMS status cache is stale"
          description: "The provider status cache on {{ $labels.instance }} has exceeded the expected staleness window."

      - alert: OpenBaoKMSCircuitBreakerOpen
        expr: max by (job, instance) (openbao_kms_circuit_breaker_state) == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "OpenBao KMS status probe circuit breaker is open"
          description: "The provider is suppressing status probes after repeated failures on {{ $labels.instance }}."

      - alert: OpenBaoKMSMetadataProbeFailing
        expr: sum by (job, instance, status) (increase(openbao_kms_transit_metadata_observation_total{status!="ok"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OpenBao KMS metadata probes are failing"
          description: "Transit metadata probes are returning status {{ $labels.status }} on {{ $labels.instance }}."

      - alert: OpenBaoKMSOpenBaoErrorRateHigh
        expr: |
          (
            sum by (job, instance) (rate(openbao_kms_openbao_requests_total{status!="ok"}[5m]))
            /
            clamp_min(sum by (job, instance) (rate(openbao_kms_openbao_requests_total[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OpenBao KMS OpenBao request error rate is high"
          description: "More than 5% of OpenBao client requests are failing on {{ $labels.instance }}."

      - alert: OpenBaoKMSAuthFailures
        expr: |
          sum by (job, instance, status) (increase(openbao_kms_auth_login_total{status!="ok"}[10m])) > 0
          or
          sum by (job, instance, status) (increase(openbao_kms_auth_renewal_total{status!="ok"}[10m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "OpenBao KMS authentication failures"
          description: "OpenBao auth lifecycle is reporting status {{ $labels.status }} on {{ $labels.instance }}."

      - alert: OpenBaoKMSTokenTTLShort
        expr: max by (job, instance) (openbao_kms_token_ttl_seconds) < 300
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "OpenBao KMS token TTL is low"
          description: "The in-memory OpenBao token TTL on {{ $labels.instance }} is below five minutes."

      - alert: OpenBaoKMSKeyIDHashDiverged
        expr: count by (job) (count by (job, hash) (openbao_kms_status_key_id_hash == 1)) > 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "OpenBao KMS active key ID hash differs across nodes"
          description: "Control-plane nodes for {{ $labels.job }} are reporting more than one active key ID hash."

      - alert: OpenBaoKMSRotationPendingStuck
        expr: min by (job, instance) (min_over_time(openbao_kms_rotation_state{state="pending"}[30m])) == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OpenBao KMS rotation is stuck pending"
          description: "A pending Transit version has not promoted on {{ $labels.instance }} for at least 30 minutes."

      - alert: OpenBaoKMSAADValidationErrors
        expr: sum by (job, instance, reason) (increase(openbao_kms_aad_validation_errors_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OpenBao KMS AAD validation errors"
          description: "Decrypt requests are failing AAD validation with reason {{ $labels.reason }} on {{ $labels.instance }}."

      - alert: OpenBaoKMSUnknownKeyIDErrors
        expr: sum by (job, instance) (increase(openbao_kms_decrypt_key_id_errors_total{reason="key_id_unknown"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OpenBao KMS unknown key ID errors"
          description: "Decrypt requests are referencing unknown key IDs on {{ $labels.instance }}."

      - alert: OpenBaoKMSGRPCLatencyHigh
        expr: |
          histogram_quantile(
            0.99,
            sum by (job, instance, method, le) (
              rate(openbao_kms_grpc_duration_seconds_bucket{method=~"encrypt|decrypt"}[5m])
            )
          ) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OpenBao KMS gRPC latency is high"
          description: "p99 {{ $labels.method }} latency is above the starter 100ms threshold on {{ $labels.instance }}; tune this threshold to local OpenBao and control-plane behavior before paging."

      - alert: OpenBaoKMSConcurrencyRejected
        expr: sum by (job, instance, method) (increase(openbao_kms_grpc_concurrency_rejections_total[5m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "OpenBao KMS rejected requests at a concurrency limit"
          description: "The provider rejected {{ $labels.method }} requests at its configured concurrency limit on {{ $labels.instance }}."

      - alert: OpenBaoKMSStaleSocketRemoved
        expr: sum by (job, instance) (increase(openbao_kms_socket_restarts_total[10m])) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "OpenBao KMS removed a stale Unix socket"
          description: "The provider removed a verified-dead socket before bind on {{ $labels.instance }}."
