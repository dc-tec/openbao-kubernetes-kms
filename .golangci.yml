version: "2"

run:
  timeout: 5m
  tests: true
  allow-parallel-runners: true

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - forbidigo
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unparam
    - unused

  settings:
    forbidigo:
      forbid:
        - pattern: 'map\[string\]any'
          msg: use a typed struct or a narrow boundary DTO
        - pattern: 'map\[string\]interface\{\}'
          msg: use a typed struct or a narrow boundary DTO
        - pattern: '\bany\b'
          msg: broad any is not allowed in production code without a reviewed boundary adapter
        - pattern: 'interface\{\}'
          msg: broad interface{} is not allowed in production code without a reviewed boundary adapter

  exclusions:
    rules:
      - path: '(.+)_test\.go'
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
