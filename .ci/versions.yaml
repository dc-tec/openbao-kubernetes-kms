version: 1

project:
  name: openbao-kubernetes-kms
  module: github.com/dc-tec/openbao-kubernetes-kms
  binary: bao-kms-provider

toolchain:
  go: "1.26.3"
  commandFramework:
    cliConfig: viper
  taskRunner: make
  qualityTools:
    astGrep: "0.42.1"
    gofumpt: "0.9.2"
    staticcheck: "0.7.0"
    govulncheck: "1.2.0"
    semgrep: "1.157.0"
    golangciLint: "2.11.4"
    pinStatus: pinned
  githubActions:
    checkout: de0fac2e4500dabe0009e67214ff5f5447ce83dd
    createGithubAppToken: 1b10c78c7865c340bc4f6099eb2f838309f1e8c3
    releasePlease: 45996ed1f6d02564a971a2fa1b5860e934307cf7
    setupGo: 4b73464bb391d4059bd26b0524d20df3927bd417
    setupNode: 48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
  goDependencies:
    cobra: "1.10.2"
    ginkgo: "2.28.3"
    grpc: "1.72.1"
    k8sKMS: "0.34.7"
    gomega: "1.40.0"
    mapstructure: "2.4.0"
    pflag: "1.0.10"
    viper: "1.20.1"
  testFrameworks:
    e2e: ginkgo
    assertions: gomega
    suiteManifest: test/e2e/suites.yaml
    reportFormats:
      - ginkgo-json
      - junit

policy:
  floatingLatestAllowed: false
  supportClaimsRequireExactPins: true
  buildOncePromoteByDigest: true

validation:
  openbao:
    primary: "2.5.3"
    image: ghcr.io/openbao/openbao:2.5.3
    imageDigest: sha256:fdc6da21ca6963560c32336fd7feb9cf2d5e52668f1a1647205a4b41171f0806
    digestStatus: pinned
  kubernetes:
    minimumLine: "1.34"
    primaryLine: "1.34"
    exactVersion: ""
    kindNodeImage: ""
    kindNodeImageDigest: ""
    pinStatus: pending
    futureCandidates:
      - "1.35"
      - "1.36"
  releaseGateRows:
    - name: openbao-2.5.3
      component: openbao
      version: "2.5.3"
      requiredFor: v0.1
    - name: kubernetes-1.34
      component: kubernetes
      version: "1.34.x"
      requiredFor: v0.1
      exactPinStatus: pending

artifacts:
  versionSource: release-please
  releasePleaseConfig: release-please-config.json
  releasePleaseManifest: .release-please-manifest.json
  imageRepository: ghcr.io/dc-tec/bao-kms-provider
  binaryName: bao-kms-provider
  distDirectory: dist/release
  binaryPattern: bao-kms-provider_${VERSION}_${GOOS}_${GOARCH}
  checksumAlgorithm: sha256
  checksumFile: checksums.txt
  linuxTargets:
    - goos: linux
      goarch: amd64
    - goos: linux
      goarch: arm64
