version: 1

project:
  name: openbao-kubernetes-kms
  module: github.com/dc-tec/openbao-kubernetes-kms
  binary: bao-kms-provider

toolchain:
  go: "1.26.3"
  commandFramework:
    cliConfig: viper
  taskRunner: make
  qualityTools:
    astGrep: "0.42.1"
    gofumpt: "0.9.2"
    staticcheck: "0.7.0"
    govulncheck: "1.2.0"
    semgrep: "1.157.0"
    golangciLint: "2.11.4"
    pinStatus: pinned
  githubActions:
    checkout: de0fac2e4500dabe0009e67214ff5f5447ce83dd
    setupGo: 4b73464bb391d4059bd26b0524d20df3927bd417
    setupNode: 48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
  goDependencies:
    cobra: "1.10.2"
    mapstructure: "2.4.0"
    pflag: "1.0.10"
    viper: "1.20.1"

policy:
  floatingLatestAllowed: false
  supportClaimsRequireExactPins: true
  buildOncePromoteByDigest: true

validation:
